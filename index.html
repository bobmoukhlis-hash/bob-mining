```html
<!-- index.html -->
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BOB Mining</title>

    <meta
        name="description"
        content="BOB Mining - Mine BOB Points"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            color: #ffffff;
            background:
                linear-gradient(
                    135deg,
                    #07111f,
                    #0d1b2a,
                    #102a43
                );
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo p {
            margin: 8px 0 0;
            color: #91a7bc;
            font-size: 14px;
        }

        .card {
            width: 100%;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            background: rgba(14, 28, 45, 0.97);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .hidden {
            display: none !important;
        }

        h2 {
            margin: 0 0 20px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #b7c8d9;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #29415b;
            border-radius: 10px;
            outline: none;
            background: #091522;
            color: #ffffff;
        }

        .form-group input:focus {
            border-color: #1683ff;
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            min-height: 46px;
            padding: 0 16px;
            border: 0;
            border-radius: 10px;
            font-weight: 700;
            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
        }

        .primary {
            background: #1683ff;
            color: #ffffff;
        }

        .secondary {
            background: #24384d;
            color: #ffffff;
        }

        .danger {
            background: #c93636;
            color: #ffffff;
        }

        .mining-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .mining-header h2 {
            margin: 0;
        }

        #levelBadge {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 12px;
            border-radius: 999px;
            background: #183a5a;
            color: #75bdff;
            font-size: 12px;
            font-weight: 800;
        }

        .balance-card {
            margin-bottom: 16px;
            padding: 24px 16px;
            border: 1px solid #1c344b;
            border-radius: 16px;
            background: #091522;
            text-align: center;
        }

        .balance-label {
            color: #8fa5ba;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #balance {
            margin-top: 8px;
            font-size: 42px;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .points {
            margin-top: 4px;
            color: #75bdff;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat {
            padding: 16px;
            border: 1px solid #1c344b;
            border-radius: 12px;
            background: #091522;
        }

        .stat-label {
            margin-bottom: 6px;
            color: #8fa5ba;
            font-size: 12px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 15px;
            border: 1px solid #1c344b;
            border-radius: 12px;
            background: #091522;
        }

        #miningStatus {
            font-weight: 800;
        }

        .status-online {
            color: #45e58b;
        }

        .status-offline {
            color: #ff6868;
        }

        .mining-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .full-button {
            width: 100%;
            margin-top: 10px;
        }

        .message {
            min-height: 20px;
            margin-top: 14px;
            color: #91a7bc;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            color: #ff7777;
        }

        .message.success {
            color: #45e58b;
        }

        .user-info {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 10px;
            background: #091522;
            color: #8fa5ba;
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 18px;
            color: #71879c;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 420px) {
            .app {
                padding: 14px;
            }

            .card {
                padding: 18px;
            }

            .logo h1 {
                font-size: 34px;
            }

            #balance {
                font-size: 34px;
            }

            .button-row,
            .mining-buttons,
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="app">
        <div class="container">

            <header class="logo">
                <h1>BOB MINING</h1>
                <p>Mine BOB Points</p>
            </header>


            <section
                id="authBox"
                class="card"
            >
                <h2>Accedi</h2>

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        autocomplete="email"
                        placeholder="La tua email"
                    >
                </div>


                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="La tua password"
                    >
                </div>


                <div class="button-row">
                    <button
                        id="loginBtn"
                        type="button"
                        class="primary"
                    >
                        Accedi
                    </button>

                    <button
                        id="signupBtn"
                        type="button"
                        class="secondary"
                    >
                        Registrati
                    </button>
                </div>


                <div
                    id="authMessage"
                    class="message"
                    aria-live="polite"
                ></div>
            </section>


            <section
                id="miningBox"
                class="card hidden"
            >
                <div class="mining-header">
                    <h2>Mining</h2>

                    <span id="levelBadge">
                        LIVELLO 1
                    </span>
                </div>


                <div
                    id="userInfo"
                    class="user-info"
                ></div>


                <div class="balance-card">
                    <div class="balance-label">
                        BOB Balance
                    </div>

                    <div id="balance">
                        0.00
                    </div>

                    <div class="points">
                        BOB Points
                    </div>
                </div>


                <div class="stats">
                    <div class="stat">
                        <div class="stat-label">
                            Hashrate
                        </div>

                        <div
                            id="hashrate"
                            class="stat-value"
                        >
                            10 GH/s
                        </div>
                    </div>


                    <div class="stat">
                        <div class="stat-label">
                            Produzione
                        </div>

                        <div
                            id="production"
                            class="stat-value"
                        >
                            0.10/min
                        </div>
                    </div>
                </div>


                <div class="status">
                    <span>
                        Mining status
                    </span>

                    <span id="miningStatus">
                        ONLINE
                    </span>
                </div>


                <div class="mining-buttons">
                    <button
                        id="toggleMiningBtn"
                        type="button"
                        class="primary"
                    >
                        Ferma Mining
                    </button>

                    <button
                        id="claimBtn"
                        type="button"
                        class="secondary"
                    >
                        Claim Points
                    </button>
                </div>


                <button
                    id="upgradeBtn"
                    type="button"
                    class="primary full-button"
                >
                    ⬆️ Upgrade Miner — 100 BOB
                </button>


                <button
                    id="logoutBtn"
                    type="button"
                    class="danger full-button"
                >
                    Logout
                </button>


                <div
                    id="miningMessage"
                    class="message"
                    aria-live="polite"
                ></div>
            </section>


            <footer class="footer">
                BOB Mining
            </footer>

        </div>
    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="./app.js"></script>

</body>
</html>
